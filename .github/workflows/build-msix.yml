name: Build CamLink Desktop MSIX

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-msix.yml"
      - "scripts/package_msix.py"
      - "requirements.txt"
      - "camlink_desktop.py"
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Exact Package/Identity name from Partner Center → Product identity"
        required: true
        default: "interspirit.Camlink-Desktop"
        type: string
      publisher:
        description: "Exact Publisher value from Partner Center → Product identity (including CN= if shown)"
        required: true
        default: "CN=2CDE3251-E7BC-48D5-85A7-AA23678D1242"
        type: string
      publisher_display_name:
        description: "Publisher display name from Partner Center"
        required: true
        default: "interspirit"
        type: string
      package_version:
        description: "Four-part package version; increment for each Store update"
        required: true
        default: "1.0.1.0"
        type: string

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        shell: pwsh

      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CamLink-Desktop camlink_desktop.py
        shell: pwsh

      - name: Package app as MSIX
        run: >
          python scripts/package_msix.py
          --exe dist/CamLink-Desktop.exe
          --output dist/CamLink-Desktop.msix
          --identity-name "${{ inputs.identity_name || 'interspirit.Camlink-Desktop' }}"
          --publisher "${{ inputs.publisher || 'CN=2CDE3251-E7BC-48D5-85A7-AA23678D1242' }}"
          --publisher-display-name "${{ inputs.publisher_display_name || 'interspirit' }}"
          --version "${{ inputs.package_version || '1.0.1.0' }}"
        shell: pwsh

      - name: Upload Microsoft Store package
        uses: actions/upload-artifact@v4
        with:
          name: CamLink-Desktop-MSIX
          path: dist/CamLink-Desktop.msix
          if-no-files-found: error
          retention-days: 14
