name: Build CamLink Desktop EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Windows connection contract
        run: python scripts/verify_connection_contract.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name CamLink-Desktop camlink_desktop.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamLink-Desktop-Windows
          path: dist/CamLink-Desktop.exe
          if-no-files-found: error
